[package]
name = "winku"
version = "0.1.1"
description = "A small desktop assistant that lives as a pair of eyes"
license = "MIT"
edition = "2021"

[lib]
name = "winku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
base64 = "0.23"
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-opener = "2"
cpal = "0.18"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
sha2 = "0.10"
bzip2 = "0.6"
tar = { version = "0.4", default-features = false }
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Model downloads. Windows uses its own TLS stack (SChannel) and certificate store; elsewhere
# rustls with the bundled Mozilla roots.
[target."cfg(windows)".dependencies.ureq]
version = "3"
default-features = false
features = ["native-tls-no-default"]

[target."cfg(not(windows))".dependencies.tauri-plugin-updater]
version = "2"

[target."cfg(not(windows))".dependencies.ureq]
version = "3"
default-features = false
features = ["rustls"]

[target."cfg(windows)".dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.27.0"
