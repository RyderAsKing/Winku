name: CI

on:
  workflow_dispatch:
  pull_request:
    # Nothing here builds or checks the docs.
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

# A new push to a pull request cancels the run that is still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Tests don't need debug info: without it the build and the link are quicker and the cache
      # is much smaller. Job-level, so rust-cache keys its cache on it.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          # sherpa-onnx-sys unpacks its prebuilt libraries here, outside what rust-cache keeps by
          # default; without it a restored build skips the download and fails to link.
          cache-directories: app/src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v1-sherpa
          # Pull requests reuse main's cache without spending minutes uploading their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tauri system dependencies
        # Runner DNS has failed to resolve Ubuntu's mirrors, stalling apt for the whole job; add
        # public resolvers as a fallback, retry slow downloads, and fail fast instead of hanging.
        timeout-minutes: 10
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nFallbackDNS=1.1.1.1 8.8.8.8\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/winku-ci.conf >/dev/null
          sudo systemctl restart systemd-resolved
          getent hosts azure.archive.ubuntu.com || echo "still can't resolve the mirror"
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99winku-ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev libasound2-dev

      - name: Engine typecheck and tests
        working-directory: engine
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          # Every test starts its own engine process; run the test files side by side.
          bun test --parallel

      - name: UI check and build, stage the engine sidecar
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
          bun run ui:build
          bun run engine

      - name: Eyes motion budget (Playwright, mock shell)
        working-directory: app
        run: |
          bunx playwright install --with-deps --only-shell chromium
          bun run motion-check

      - name: Shell fmt, clippy, tests
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Windows is split in two jobs that run side by side: the release build with the smoke test
  # and measurements, and the tests (which need their own debug build). The build job is the
  # longest of the three, so it sets how long a pull request waits.
  windows-build:
    runs-on: windows-latest
    env:
      # CI only needs a working optimised app to smoke-test and measure, not the release's
      # smallest binary: skip whole-program LTO, which is single-threaded and took about 2.5 of the
      # job's 5.5 minutes. Releases (release.yml) keep the full Cargo.toml profile. Job-level, so
      # rust-cache keys its cache on these too.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          # sherpa-onnx-sys unpacks its prebuilt libraries here, outside what rust-cache keeps by
          # default; without it a restored build skips the download and fails to link.
          cache-directories: app/src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v1-sherpa
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Bun packages
        # Installing the engine's packages takes about 17 s on Windows.
        uses: actions/cache@v4
        with:
          path: |
            engine/node_modules
            app/node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('engine/bun.lock', 'app/bun.lock') }}

      - name: Build app (release, no installer)
        working-directory: app
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun run engine
          Get-Item ../engine/dist/winku-engine.exe | Select-Object Name, @{n="SizeMB";e={[math]::Round($_.Length/1MB,1)}}
          # Optimising the shell crate itself is 35 of the build's 115 seconds (measured: 47 s at
          # the release level, 13 s without), so pull requests skip it. The dependencies stay
          # optimised either way, and main builds the crate as a release does.
          $cargo = @()
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") { $cargo = "--", "--locked", "--config", "profile.release.package.winku.opt-level=0" }
          bunx tauri build --no-bundle @cargo
          Get-Item src-tauri/target/release/winku.exe | Select-Object Name, @{n="SizeMB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Smoke test, idle memory and idle CPU
        working-directory: app
        # About 45 s on main, where the numbers are kept; pull requests settle and sample for
        # half as long, which is enough to see a change. The budgets only warn. Once hung for 28
        # minutes before printing anything (a stuck WMI query on the runner, not the app): fail
        # fast instead of waiting out the job timeout.
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            ./scripts/measure-memory.ps1 -SettleSeconds 10 -CpuSampleSeconds 10
          } else {
            ./scripts/measure-memory.ps1
          }

      - name: Computer use end to end (agent-desktop drives Notepad)
        # The desktop_* tool code with the bundled agent-desktop: launch Notepad, observe, set and
        # type text, observe again to verify, abort a wait; prints CLI vs MCP latency.
        working-directory: engine
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:WINKU_AGENT_DESKTOP_BIN = (Resolve-Path ../app/src-tauri/binaries/agent-desktop-x86_64-pc-windows-msvc.exe).Path
          bun run test/desktop-e2e.ts

      - name: Screenshots on the Windows desktop
        working-directory: app
        timeout-minutes: 3
        shell: pwsh
        continue-on-error: true
        run: ./scripts/windows-shots.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: ${{ runner.temp }}/winku-shots

      - name: Perf probe (window moves, idle CPU, Chromium in front)
        # About 2 minutes, so not on pull requests: main and manual runs keep the numbers.
        if: github.event_name != 'pull_request'
        working-directory: app
        # Windows PowerShell: the probe compiles a WinForms helper, which is simplest on .NET Framework.
        shell: powershell
        timeout-minutes: 10
        run: ./scripts/perf-probe.ps1

      - name: Upload the probe's pill screenshots
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: perf-probe-pill
          path: ${{ runner.temp }}/probe-pill*.png
          if-no-files-found: ignore

  windows-tests:
    runs-on: windows-latest
    env:
      # As on Linux: no debug info in the test build.
      CARGO_PROFILE_DEV_DEBUG: "0"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          # sherpa-onnx-sys unpacks its prebuilt libraries here, outside what rust-cache keeps by
          # default; without it a restored build skips the download and fails to link.
          cache-directories: app/src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v1-sherpa
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Bun packages
        # Installing the engine's packages takes about 17 s on Windows.
        uses: actions/cache@v4
        with:
          path: |
            engine/node_modules
            app/node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('engine/bun.lock', 'app/bun.lock') }}

      - name: Engine tests (compiled exe)
        # The engine ships as a compiled exe, so that is what Windows tests. The same tests run
        # from source on Linux, with the typecheck; from source here they took over 90 s, since
        # every test starts an engine and Bun starts slowly from source on Windows.
        working-directory: engine
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun run build
          $env:WINKU_ENGINE_BIN = (Resolve-Path dist/winku-engine.exe).Path
          bun test --parallel

      - name: Shell tests
        working-directory: app/src-tauri
        shell: pwsh
        run: |
          # The sidecars only have to exist for tauri-build; the tests don't run them.
          New-Item -ItemType Directory -Force binaries | Out-Null
          New-Item -ItemType File -Force binaries/winku-engine-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force binaries/agent-desktop-x86_64-pc-windows-msvc.exe | Out-Null
          cargo test
