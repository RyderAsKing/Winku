[package]
name = "winku"
version = "0.6.0"
description = "A small desktop assistant that lives as a pair of eyes"
license = "MIT"
edition = "2021"

# A plain Rust library: Winku is desktop only. Tauri's template also asks for a static and a
# dynamic library (for mobile), and each one is another full link of the speech libraries on
# every build.
[lib]
name = "winku_lib"
doctest = false

# main.rs only calls the library; without this, `cargo test` links a second, empty test program.
[[bin]]
name = "winku"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a transparent window on macOS (tauri.conf.json's macOSPrivateApi). It changes
# nothing elsewhere.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde_json = "1"
base64 = "0.23"
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-opener = "2"
cpal = "0.18"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
# Memory search (recall::embedder) runs on the ONNX Runtime sherpa-onnx already links in:
# `alternative-backend` stops ort from linking or downloading one of its own, and the embedder
# hands it that runtime's API table. api-24 is the newest table ORT 1.24+ serves; sherpa's is 1.28.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "alternative-backend", "api-24"] }
# BERT WordPiece tokenisation for the embedder (recall::wordpiece).
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
sha2 = "0.10"
bzip2 = "0.6"
tar = { version = "0.4", default-features = false }
tauri-plugin-autostart = "2"
# Local HH:MM in scheduled-task notices.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Text normalisation before speech (voice::speech_text).
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Model downloads. Windows uses its own TLS stack (SChannel) and certificate store; elsewhere
# rustls with the bundled Mozilla roots.
[target."cfg(windows)".dependencies.ureq]
version = "3"
default-features = false
features = ["native-tls-no-default"]

[target."cfg(not(windows))".dependencies.tauri-plugin-updater]
version = "2"

[target."cfg(not(windows))".dependencies.ureq]
version = "3"
default-features = false
features = ["rustls"]

[target."cfg(windows)".dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# X11 (docs/adr/0003-linux-runs-on-x11.md): pure Rust, no extra system libraries.
x11rb = { version = "0.13", features = ["shape", "xtest", "xfixes", "res", "xinput"] }
# Already in the build through Tauri: GTK's backend choice, and the main window's X11 id.
gtk = "0.18"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# AppKit, Quartz and Core Foundation (platform/macos.rs, hint/eventtap.rs): the same crates Tauri
# already builds on macOS, with only the parts Winku calls.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSAccessibility", "NSBitmapImageRep", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGRemoteOperation", "CGWindow"] }

[dev-dependencies]
tempfile = "3.27.0"
