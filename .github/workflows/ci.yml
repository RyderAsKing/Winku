name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run that is still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          # sherpa-onnx-sys unpacks its prebuilt libraries here, outside what rust-cache keeps by
          # default; without it a restored build skips the download and fails to link.
          cache-directories: app/src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v1-sherpa
          # Pull requests reuse main's cache without spending minutes uploading their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tauri system dependencies
        # The runner's Azure apt mirror sometimes stalls on every package for the whole job;
        # use Ubuntu's own mirror, retry slow downloads, and fail fast instead of hanging.
        timeout-minutes: 10
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99winku-ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev libasound2-dev

      - name: Engine typecheck and tests
        working-directory: engine
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: UI check and build, stage the engine sidecar
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
          bun run ui:build
          bun run engine

      - name: Eyes motion budget (Playwright, mock shell)
        working-directory: app
        run: |
          bunx playwright install --with-deps chromium
          bun run motion-check

      - name: Shell fmt, clippy, tests
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Windows is split in two jobs that run side by side: the release build with the smoke test
  # and measurements, and the tests (which need their own debug build).
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          # sherpa-onnx-sys unpacks its prebuilt libraries here, outside what rust-cache keeps by
          # default; without it a restored build skips the download and fails to link.
          cache-directories: app/src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v1-sherpa
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build app (release, no installer)
        working-directory: app
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun run engine
          Get-Item ../engine/dist/winku-engine.exe | Select-Object Name, @{n="SizeMB";e={[math]::Round($_.Length/1MB,1)}}
          bunx tauri build --no-bundle
          Get-Item src-tauri/target/release/winku.exe | Select-Object Name, @{n="SizeMB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Smoke test, idle memory and idle CPU
        working-directory: app
        shell: pwsh
        run: ./scripts/measure-memory.ps1

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          # sherpa-onnx-sys unpacks its prebuilt libraries here, outside what rust-cache keeps by
          # default; without it a restored build skips the download and fails to link.
          cache-directories: app/src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v1-sherpa
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Engine tests (source)
        working-directory: engine
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Engine tests (compiled exe)
        working-directory: engine
        shell: pwsh
        run: |
          bun run build
          $env:WINKU_ENGINE_BIN = (Resolve-Path dist/winku-engine.exe).Path
          bun test

      - name: Shell tests
        working-directory: app/src-tauri
        shell: pwsh
        run: |
          # The sidecar only has to exist for tauri-build; the tests don't run it.
          New-Item -ItemType Directory -Force binaries | Out-Null
          New-Item -ItemType File -Force binaries/winku-engine-x86_64-pc-windows-msvc.exe | Out-Null
          cargo test
