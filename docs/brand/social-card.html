<!doctype html>
<!-- The GitHub social preview, 1280x640. Rendered to social-card.png by `bun run brand` in app/.
     The card's bottom edge is the edge of the screen; the eyes peek up over it. -->
<html>
<head>
<meta charset="utf-8">
<style>
	@font-face {
		font-family: "Nunito";
		src: url("fonts/Nunito-Variable.ttf") format("truetype");
		font-weight: 200 1000;
	}
	html, body {
		margin: 0;
		width: 1280px;
		height: 640px;
		overflow: hidden;
	}
	body {
		position: relative;
		background: #0c0e13;
		font-family: "Nunito", sans-serif;
	}
	.words {
		position: absolute;
		top: 104px;
		left: 0;
		right: 0;
		display: grid;
		justify-items: center;
		gap: 34px;
	}
	.wordmark {
		height: 118px;
	}
	p {
		margin: 0;
		max-width: 820px;
		color: #aaaeb9;
		font-size: 36px;
		font-weight: 600;
		line-height: 1.3;
		text-align: center;
		text-wrap: balance;
	}
	.peek {
		position: absolute;
		bottom: 0;
		left: 50%;
		width: 540px;
		translate: -50% 0;
		display: block;
	}
</style>
</head>
<body>
	<div class="words">
		<img class="wordmark" src="wordmark-light.svg" alt="Winku">
		<p>A desktop assistant that lives as a pair of eyes at the edge of your screen.</p>
	</div>
	<img class="peek" src="peek.svg" alt="">
</body>
</html>
